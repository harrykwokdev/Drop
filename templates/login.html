<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0b16">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%236366f1'/%3E%3Cpath d='M55 18 30 56h16l-6 26 26-40H50z' fill='white'/%3E%3C/svg%3E">
    <title>Drop · 登录</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-card">
        <div class="login-icon"><i class="fas fa-lock"></i></div>
        <h1>Drop</h1>
        <p class="subtitle">请输入访问口令</p>
        {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
        <form method="post" action="{{ url_for('login') }}">
            <input type="password" name="token" class="login-input" placeholder="访问口令" autofocus required>
            <button type="submit" class="main-btn login-btn">进入</button>
        </form>
    </div>
</body>
</html>
